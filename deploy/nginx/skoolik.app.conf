# Exemple de configuration nginx pour skoolik.app (à copier dans /etc/nginx/sites-available/).
# Certificat : sudo certbot --nginx -d skoolik.app -d www.skoolik.app
server {
    listen 80;
    listen [::]:80;
    server_name skoolik.app www.skoolik.app;
    return 301 https://skoolik.app$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.skoolik.app;
    ssl_certificate     /etc/letsencrypt/live/skoolik.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skoolik.app/privkey.pem;
    return 301 https://skoolik.app$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name skoolik.app;
    ssl_certificate     /etc/letsencrypt/live/skoolik.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skoolik.app/privkey.pem;

    root /var/www/skoolik.app;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    # Fichiers avec empreinte (Vite) : cache long
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # Fiches PDF et aperçus : cache d'un jour
    location /telechargements/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri $uri/ =404;
    }
    # L'app utilise un routage par # : seules les vraies pages existent
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
