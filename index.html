<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- anciennes adresses `/#/chemin?x` → `/chemin?x` (adresses propres), avant le chargement de l'app ; testé par tests/navigation.test.mjs -->
    <script>
      (function () {
        var h = location.hash
        if (h.charAt(1) !== '/') return
        // `?a=1#/chemin?b=2` → `/chemin?a=1&b=2` : les paramètres d'avant et d'après le # sont gardés
        var i = h.indexOf('?'), chemin = i < 0 ? h.slice(2) : h.slice(2, i)
        var q = [location.search.slice(1), i < 0 ? '' : h.slice(i + 1)].filter(Boolean).join('&')
        history.replaceState(null, '', '%BASE_URL%' + chemin + (q ? '?' + q : ''))
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%SITE_TITRE%</title>
    <meta name="description" content="%SITE_DESCRIPTION%" />
    <link rel="canonical" href="%SITE_URL%" />
    <!-- aperçu lors d'un partage : l'icône du site (public/icone-512.png) ; site.webmanifest est produit par le plugin Vite (vite.config.js) ; titre, canonical et noindex suivent la route (src/router/canonique.ts) ; les pages de fiches ont leurs propres balises (scripts/statique/) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%SITE_NOM%" />
    <meta property="og:title" content="%SITE_TITRE%" />
    <meta property="og:description" content="%SITE_DESCRIPTION%" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%icone-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%BASE_URL%favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <meta name="theme-color" content="%SITE_COULEUR%" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
