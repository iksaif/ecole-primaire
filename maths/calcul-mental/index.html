<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calcul Mental — École Primaire</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    .config-panel {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.5rem;
      max-width: 680px;
      margin: 0 auto 1.5rem;
    }
    .config-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: .75rem;
      margin-bottom: .75rem;
    }
    .config-row:last-child { margin-bottom: 0; }
    .config-label { font-weight: 700; }
    .op-btns, .level-selector { justify-content: flex-start; }

    .timer-bar {
      width: 100%;
      height: 8px;
      background: var(--gris-brd);
      border-radius: 4px;
      overflow: hidden;
      margin: .5rem 0;
    }
    .timer-fill {
      height: 100%;
      border-radius: 4px;
      background: var(--bleu);
      transition: width .1s linear;
    }
    .timer-fill.urgent { background: var(--rouge); }

    .result-screen {
      text-align: center;
      padding: 2rem;
      display: none;
    }
    .result-screen.visible { display: block; }
    .result-score {
      font-size: 4rem;
      font-weight: 900;
    }
    .result-msg {
      font-size: 1.3rem;
      color: #555;
      margin: .5rem 0 1.5rem;
    }
    .historique {
      max-height: 240px;
      overflow-y: auto;
      text-align: left;
      border: 2px solid var(--gris-brd);
      border-radius: 8px;
      padding: .5rem;
      margin: 1rem 0;
      font-size: .9rem;
    }
    .hist-item {
      display: flex;
      justify-content: space-between;
      padding: .3rem .5rem;
      border-radius: 6px;
    }
    .hist-item.ok     { background: #f0faf0; }
    .hist-item.erreur { background: #fef0f0; }
  </style>
</head>
<body>

<nav class="nav">
  <a href="../../index.html" class="nav-logo">📚 École Primaire</a>
  <ul class="nav-links">
    <li><a href="../../maths/index.html" class="active">🔢 Maths</a></li>
    <li><a href="../../francais/index.html">📝 Français</a></li>
    <li><a href="../../lecture/index.html">📖 Lecture</a></li>
    <li><a href="../../autres/index.html">🌍 Autres</a></li>
  </ul>
</nav>

<div class="container">
  <h1 class="section-heading">🧮 Calcul mental</h1>

  <!-- Configuration -->
  <div class="config-panel" id="configPanel">
    <div class="config-row">
      <span class="config-label">Niveau :</span>
      <div class="level-selector" id="levelSelector">
        <button class="level-btn" data-level="cp">CP</button>
        <button class="level-btn" data-level="ce1">CE1</button>
        <button class="level-btn active" data-level="ce2">CE2</button>
        <button class="level-btn" data-level="cm1">CM1</button>
        <button class="level-btn" data-level="cm2">CM2</button>
      </div>
    </div>
    <div class="config-row">
      <span class="config-label">Opérations :</span>
      <div class="op-btns" id="opBtns" style="display:flex;gap:.5rem;flex-wrap:wrap;">
        <button class="level-btn active" data-op="+">+ Addition</button>
        <button class="level-btn active" data-op="-">− Soustraction</button>
        <button class="level-btn" data-op="×">× Multiplication</button>
        <button class="level-btn" data-op="÷">÷ Division</button>
      </div>
    </div>
    <div class="config-row">
      <span class="config-label">Nombre de questions :</span>
      <div style="display:flex;gap:.5rem;">
        <button class="level-btn" data-nb="5">5</button>
        <button class="level-btn active" data-nb="10">10</button>
        <button class="level-btn" data-nb="20">20</button>
      </div>
    </div>
    <div class="config-row">
      <span class="config-label">Temps par question :</span>
      <div style="display:flex;gap:.5rem;">
        <button class="level-btn" data-temps="0">Sans limite</button>
        <button class="level-btn active" data-temps="10">10 s</button>
        <button class="level-btn" data-temps="20">20 s</button>
        <button class="level-btn" data-temps="30">30 s</button>
      </div>
    </div>
    <div style="text-align:center;margin-top:1rem;">
      <button class="btn btn-primary" id="startBtn">▶ Commencer</button>
    </div>
  </div>

  <!-- Exercice -->
  <div id="exercicePanel" style="display:none;">
    <div class="score-bar">
      <span id="qCounter">Question 1 / 10</span>
      <span>✅ <span id="bonnes">0</span> &nbsp; ❌ <span id="mauvaises">0</span></span>
      <span id="timerDisplay" style="font-weight:700;min-width:3rem;text-align:right;"></span>
    </div>

    <div class="exercise-box">
      <div class="timer-bar" id="timerBar" style="display:none;">
        <div class="timer-fill" id="timerFill"></div>
      </div>
      <div class="exercise-question" id="question"></div>
      <input class="exercise-input" type="number" inputmode="numeric"
             id="reponse" placeholder="?" autocomplete="off">
      <div class="feedback" id="feedback"></div>
      <div style="display:flex;gap:.75rem;justify-content:center;margin-top:1rem;">
        <button class="btn btn-ghost" id="passerBtn">Passer ⏭</button>
        <button class="btn btn-primary" id="validerBtn">Valider ✔</button>
      </div>
    </div>
  </div>

  <!-- Résultats -->
  <div class="exercise-box result-screen" id="resultPanel">
    <div class="result-score" id="resultScore"></div>
    <div class="result-msg" id="resultMsg"></div>
    <div class="historique" id="historique"></div>
    <div style="display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;">
      <button class="btn btn-primary" id="rejouerBtn">🔄 Rejouer</button>
      <button class="btn btn-ghost" id="configBtn">⚙️ Paramètres</button>
    </div>
  </div>
</div>

<script src="../../js/utils.js"></script>
<script>
// ── Configuration
const NIVEAUX = {
  cp:  { add: [1,10],  sou: [1,10],  mul: null,    div: null },
  ce1: { add: [1,20],  sou: [1,20],  mul: [2,5],   div: [1,5] },
  ce2: { add: [1,99],  sou: [1,99],  mul: [2,9],   div: [1,9] },
  cm1: { add: [1,999], sou: [1,999], mul: [2,12],  div: [1,12] },
  cm2: { add: [1,999], sou: [1,999], mul: [2,25],  div: [1,25] },
};

let config = {
  niveau: Utils.charger('calcul_niveau', 'ce2'),
  ops: Utils.charger('calcul_ops', ['+', '-']),
  nbQ: Utils.charger('calcul_nbQ', 10),
  temps: Utils.charger('calcul_temps', 10),
};

let etat = { questions: [], idx: 0, bonnes: 0, mauvaises: 0, historique: [] };
let timerInterval = null;
let tempsRestant = 0;

// ── Helpers
function genererQuestion() {
  const niv = NIVEAUX[config.niveau];
  const opsDispos = config.ops.filter(op => {
    if (op === '×' && !niv.mul) return false;
    if (op === '÷' && !niv.div) return false;
    return true;
  });
  const op = opsDispos[Utils.aleatoire(0, opsDispos.length - 1)];

  let a, b, reponse;
  if (op === '+') {
    a = Utils.aleatoire(...niv.add);
    b = Utils.aleatoire(...niv.add);
    reponse = a + b;
  } else if (op === '-') {
    a = Utils.aleatoire(...niv.sou);
    b = Utils.aleatoire(1, a); // résultat positif
    reponse = a - b;
  } else if (op === '×') {
    a = Utils.aleatoire(...niv.mul);
    b = Utils.aleatoire(...niv.mul);
    reponse = a * b;
  } else { // ÷
    b = Utils.aleatoire(...niv.div);
    reponse = Utils.aleatoire(...niv.div);
    a = b * reponse;
  }

  return { texte: `${a} ${op} ${b} = ?`, reponse };
}

// ── Config UI
document.querySelectorAll('[data-level]').forEach(btn => {
  btn.classList.toggle('active', btn.dataset.level === config.niveau);
  btn.addEventListener('click', () => {
    config.niveau = btn.dataset.level;
    Utils.sauvegarder('calcul_niveau', config.niveau);
    document.querySelectorAll('[data-level]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

document.querySelectorAll('[data-op]').forEach(btn => {
  btn.classList.toggle('active', config.ops.includes(btn.dataset.op));
  btn.addEventListener('click', () => {
    const op = btn.dataset.op;
    if (config.ops.includes(op)) {
      if (config.ops.length === 1) return; // au moins une op
      config.ops = config.ops.filter(o => o !== op);
      btn.classList.remove('active');
    } else {
      config.ops.push(op);
      btn.classList.add('active');
    }
    Utils.sauvegarder('calcul_ops', config.ops);
  });
});

document.querySelectorAll('[data-nb]').forEach(btn => {
  btn.classList.toggle('active', +btn.dataset.nb === config.nbQ);
  btn.addEventListener('click', () => {
    config.nbQ = +btn.dataset.nb;
    Utils.sauvegarder('calcul_nbQ', config.nbQ);
    document.querySelectorAll('[data-nb]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

document.querySelectorAll('[data-temps]').forEach(btn => {
  btn.classList.toggle('active', +btn.dataset.temps === config.temps);
  btn.addEventListener('click', () => {
    config.temps = +btn.dataset.temps;
    Utils.sauvegarder('calcul_temps', config.temps);
    document.querySelectorAll('[data-temps]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

// ── Démarrage
document.getElementById('startBtn').addEventListener('click', demarrer);
document.getElementById('rejouerBtn').addEventListener('click', demarrer);
document.getElementById('configBtn').addEventListener('click', () => {
  document.getElementById('resultPanel').classList.remove('visible');
  document.getElementById('configPanel').style.display = '';
});
document.getElementById('validerBtn').addEventListener('click', valider);
document.getElementById('passerBtn').addEventListener('click', passer);
document.getElementById('reponse').addEventListener('keydown', e => {
  if (e.key === 'Enter') valider();
});

function demarrer() {
  clearInterval(timerInterval);
  etat = {
    questions: Array.from({ length: config.nbQ }, genererQuestion),
    idx: 0, bonnes: 0, mauvaises: 0, historique: []
  };
  document.getElementById('configPanel').style.display = 'none';
  document.getElementById('resultPanel').classList.remove('visible');
  document.getElementById('exercicePanel').style.display = '';
  afficherQuestion();
}

function afficherQuestion() {
  const q = etat.questions[etat.idx];
  document.getElementById('qCounter').textContent =
    `Question ${etat.idx + 1} / ${config.nbQ}`;
  document.getElementById('bonnes').textContent = etat.bonnes;
  document.getElementById('mauvaises').textContent = etat.mauvaises;
  document.getElementById('question').textContent = q.texte;
  const inp = document.getElementById('reponse');
  inp.value = '';
  inp.className = 'exercise-input';
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';

  // Timer
  const timerBar = document.getElementById('timerBar');
  const timerFill = document.getElementById('timerFill');
  const timerDisplay = document.getElementById('timerDisplay');
  clearInterval(timerInterval);
  if (config.temps > 0) {
    timerBar.style.display = '';
    timerDisplay.textContent = `⏱ ${config.temps}s`;
    tempsRestant = config.temps;
    timerFill.style.width = '100%';
    timerFill.className = 'timer-fill';
    timerInterval = setInterval(() => {
      tempsRestant -= 0.1;
      const pct = (tempsRestant / config.temps) * 100;
      timerFill.style.width = pct + '%';
      timerDisplay.textContent = `⏱ ${Math.ceil(tempsRestant)}s`;
      if (pct < 30) timerFill.className = 'timer-fill urgent';
      if (tempsRestant <= 0) {
        clearInterval(timerInterval);
        mauvaisRep(true);
      }
    }, 100);
  } else {
    timerBar.style.display = 'none';
    timerDisplay.textContent = '';
  }

  setTimeout(() => inp.focus(), 50);
}

function valider() {
  const val = document.getElementById('reponse').value.trim();
  if (val === '') return;
  clearInterval(timerInterval);
  const q = etat.questions[etat.idx];
  if (+val === q.reponse) {
    bonneRep();
  } else {
    mauvaisRep(false, +val);
  }
}

function passer() {
  clearInterval(timerInterval);
  mauvaisRep(true);
}

function bonneRep() {
  const inp = document.getElementById('reponse');
  const fb  = document.getElementById('feedback');
  inp.className = 'exercise-input ok';
  const msgs = ['Bravo ! 🎉', 'Excellent ! ⭐', 'Parfait ! 👏', 'Super ! 🌟'];
  fb.textContent = msgs[Utils.aleatoire(0, msgs.length - 1)];
  fb.className = 'feedback ok';
  etat.bonnes++;
  etat.historique.push({ texte: etat.questions[etat.idx].texte, ok: true });
  setTimeout(suivant, 800);
}

function mauvaisRep(timeout, reponseEleve) {
  const inp = document.getElementById('reponse');
  const fb  = document.getElementById('feedback');
  const q   = etat.questions[etat.idx];
  inp.className = 'exercise-input erreur';
  if (timeout) {
    fb.textContent = `⏰ Temps écoulé ! La réponse était ${q.reponse}`;
  } else {
    fb.textContent = `❌ La bonne réponse était ${q.reponse}`;
  }
  fb.className = 'feedback erreur';
  etat.mauvaises++;
  etat.historique.push({ texte: q.texte, ok: false, attendu: q.reponse, donne: reponseEleve });
  setTimeout(suivant, 1200);
}

function suivant() {
  etat.idx++;
  if (etat.idx >= config.nbQ) {
    afficherResultats();
  } else {
    afficherQuestion();
  }
}

function afficherResultats() {
  clearInterval(timerInterval);
  document.getElementById('exercicePanel').style.display = 'none';
  const panel = document.getElementById('resultPanel');
  panel.classList.add('visible');

  const pct = Math.round((etat.bonnes / config.nbQ) * 100);
  document.getElementById('resultScore').textContent =
    `${etat.bonnes} / ${config.nbQ}`;

  let msg;
  if (pct === 100) { msg = 'Parfait, sans faute ! 🏆'; Utils.confettis(50); }
  else if (pct >= 80) { msg = 'Très bien ! Continue comme ça 🌟'; Utils.confettis(25); }
  else if (pct >= 60) { msg = 'Bien ! Tu peux encore progresser 💪'; }
  else if (pct >= 40) { msg = 'Courage, continue à t\'entraîner ! 🤓'; }
  else { msg = 'N\'abandonne pas, pratique encore ! 📚'; }
  document.getElementById('resultMsg').textContent = msg;

  const hist = document.getElementById('historique');
  hist.innerHTML = etat.historique.map(h =>
    `<div class="hist-item ${h.ok ? 'ok' : 'erreur'}">
      <span>${h.texte.replace('?', h.ok ? h.attendu ?? '✓' : (h.donne ?? '—'))}</span>
      <span>${h.ok ? '✅' : `❌ (réponse : ${h.attendu})`}</span>
    </div>`
  ).join('');
}
</script>

</body>
</html>
