<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquettes de structure — plan 12</title>
<style>
/* ═══ Charte (reprise de src/style.css) ═══ */
:root {
  --bleu:#4a90e2; --bleu-fort:#2f70c0; --texte-doux:#6b6b6b;
  --vert-texte:#2e7d32; --rouge-texte:#c0392b; --orange-texte:#8f5500;
  --vert:#5cb85c; --rouge:#e74c3c; --orange:#f39c12; --violet:#9b59b6; --jaune:#f1c40f; --rose:#e91e8c;
  --gris-bg:#f8f9fa; --gris-brd:#dee2e6; --texte:#2c3e50; --radius:12px; --shadow:0 4px 12px rgba(0,0,0,.1);
  --c1:#e91e8c; --c2:#2f70c0; --c3:#7d3c98;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--gris-bg);color:var(--texte);min-height:100vh;line-height:1.4}
a{color:var(--bleu-fort)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:where(a,button,summary,select,input,[tabindex]):focus-visible{outline:3px solid var(--bleu-fort);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
[hidden]{display:none!important}

/* ═══ Barre de démonstration (hors maquette) ═══ */
#demo{background:#1f2937;color:#e5e7eb;font-size:.8rem;padding:.5rem .75rem;display:flex;flex-wrap:wrap;gap:.4rem 1rem;align-items:center;position:relative;z-index:50}
#demo b{color:#fff;font-weight:700}
#demo .grp{display:flex;align-items:center;gap:.3rem;flex-wrap:wrap}
#demo .grp>span{color:#9ca3af;margin-right:.1rem}
#demo button,#demo select{background:#374151;border:1px solid #4b5563;color:#f3f4f6;border-radius:6px;padding:.15rem .5rem;font-size:.8rem}
#demo button[aria-pressed="true"]{background:#fbbf24;border-color:#fbbf24;color:#111827;font-weight:700}
#demo :focus-visible{outline-color:#fbbf24}
.phone-on body{background:#d1d5db}

/* ═══ Cadre « appareil » ═══ */
.device{position:relative;background:var(--gris-bg)}
.phone .device{box-sizing:content-box;width:360px;height:720px;border:8px solid #1f2937;border-radius:30px;overflow:hidden;margin:1rem auto}
.scroller{height:100%}
.phone .scroller{overflow-y:auto;overflow-x:hidden}
.viewport{container-type:inline-size;container-name:vp;min-height:100%;display:flex;flex-direction:column}
main{flex:1}
.container{max-width:1100px;margin:0 auto;padding:1.5rem 1.25rem;width:100%}
@container vp (max-width:700px){.container{padding:1rem 16px}}

/* ═══ Éléments communs ═══ */
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.6rem 1.2rem;border-radius:8px;border:none;font-size:1rem;font-weight:700;text-decoration:none;transition:opacity .15s,transform .1s;background:var(--gris-bg);color:var(--texte);border:2px solid var(--gris-brd)}
.btn:hover{opacity:.88}.btn:active{transform:scale(.97)}
.btn-primary{background:var(--bleu-fort);color:#fff;border-color:var(--bleu-fort)}
.btn-success{background:var(--vert-texte);color:#fff;border-color:var(--vert-texte)}
.btn-sm{padding:.3rem .8rem;font-size:.88rem}
.level-btn{padding:.4rem 1rem;border-radius:20px;border:2px solid var(--gris-brd);background:#fff;font-weight:700;font-size:.85rem;transition:border-color .15s,background .15s,color .15s;white-space:nowrap}
.level-btn:hover{border-color:var(--bleu);color:var(--bleu-fort)}
.level-btn.active{background:var(--bleu-fort);border-color:var(--bleu-fort);color:#fff}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:1.25rem}
h1{font-size:1.9rem;font-weight:900;line-height:1.2;margin-bottom:.35rem}
h2{font-size:1.3rem;font-weight:800}
h3{font-size:1rem;font-weight:800}
.lead{color:#555;font-size:1.05rem}
.muted{color:var(--texte-doux)}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.crumbs{font-size:.85rem;color:var(--texte-doux);margin-bottom:.8rem}
.crumbs a{color:var(--bleu-fort)}
.crumbs span[aria-hidden]{margin:0 .3rem}

/* pastilles de classes */
.pills{display:inline-flex;flex-wrap:wrap;gap:3px}
.cl{font-size:.7rem;font-weight:800;padding:.08rem .45rem;border-radius:20px;background:#eef1f4;color:#555;border:1px solid transparent;white-space:nowrap}
.cl.sel{background:var(--bleu-fort);color:#fff}
.badge{font-size:.72rem;font-weight:700;padding:.1rem .5rem;border-radius:20px;white-space:nowrap}
.b-print{background:#fff3e0;color:var(--orange-texte)}
.b-online{background:#e8f6e8;color:var(--vert-texte)}
.b-lang{background:#eef1f4;color:#444}
.br{border-bottom:1px dotted #8a8a8a;cursor:help}
.br-sub{display:inline;margin-left:.35em;font-size:.72em;font-weight:600;opacity:.8;line-height:1.1}
.tile .br-sub,.kid-tile .br-sub{display:block;margin:0}
.flag{display:inline-block;vertical-align:middle;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.2)}

/* ═══ Navigation ═══ */
.nav{background:#fff;box-shadow:var(--shadow);padding:.55rem 1.25rem;display:flex;align-items:center;gap:.5rem 1rem;position:sticky;top:0;z-index:30}
.logo{font-size:1.4rem;font-weight:800;text-decoration:none;color:var(--bleu-fort);white-space:nowrap}
.nav-links{display:flex;gap:.3rem}
.nav-links a{text-decoration:none;padding:.35rem .8rem;border-radius:20px;font-weight:700;font-size:.92rem;color:var(--texte);white-space:nowrap;line-height:1.15}
.nav-links a:hover{background:var(--gris-bg)}
.nav-links a.active{background:var(--bleu-fort);color:#fff}
.nav-links a .br-sub{display:inline;margin-left:.3rem}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:.4rem}
.nbtn{display:inline-flex;align-items:center;gap:.35rem;background:var(--gris-bg);border:2px solid transparent;border-radius:20px;padding:.3rem .7rem;font-size:.88rem;font-weight:700;text-decoration:none;color:var(--texte);white-space:nowrap}
.nbtn:hover{border-color:var(--gris-brd)}
.nbtn[aria-expanded="true"]{border-color:var(--bleu);background:#fff}
.nbtn kbd{font:inherit;font-size:.7rem;border:1px solid var(--gris-brd);background:#fff;border-radius:4px;padding:0 .3rem;color:var(--texte-doux)}
.nbtn.classe{background:#e8f6e8;border-color:var(--vert)}
.nbtn.locked{background:#fff8e1;border-color:#f5c27a}
.dd{position:relative}
.dd-panel{position:absolute;right:0;top:calc(100% + 8px);background:#fff;border-radius:var(--radius);box-shadow:0 8px 28px rgba(0,0,0,.2);padding:.75rem;min-width:270px;z-index:40;border:1px solid var(--gris-brd)}
.dd-panel h3{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--texte-doux);margin-bottom:.4rem}
.opt{display:flex;gap:.6rem;align-items:flex-start;width:100%;text-align:left;background:#fff;border:2px solid var(--gris-brd);border-radius:10px;padding:.5rem .65rem;margin-bottom:.4rem}
.opt:hover{border-color:var(--bleu)}
.opt[aria-pressed="true"]{border-color:var(--bleu-fort);background:#eef5fd}
.opt strong{display:block;font-size:.92rem}
.opt small{display:block;color:var(--texte-doux);font-size:.78rem;line-height:1.25}
.opt .ico{font-size:1.2rem;line-height:1.2;min-width:2.4rem}
.dd-panel .foot{font-size:.76rem;color:var(--texte-doux);margin-top:.3rem}
.wide{display:revert}.narrow{display:none}
.nav-links.wide{display:flex}
@container vp (max-width:1440px){.nav-links a{padding:.3rem .6rem}.nbtn .lbl,.nbtn kbd{display:none}.nav{padding:.55rem 1rem;gap:.5rem .7rem}}
@container vp (max-width:760px){
  .wide,.nav-links.wide{display:none!important}.narrow{display:inline-flex}
  .nav{padding:.45rem 16px;gap:.4rem}.logo{font-size:1.15rem}
  .nav-right{gap:.25rem;min-width:0}
  .nbtn{padding:.3rem .55rem}.nbtn.classe .ic1{display:none}.logo{font-size:1.02rem}.nav{gap:.25rem}
  .dd-panel{position:fixed;left:8px;right:8px;top:auto;min-width:0}
  .menu-panel.narrow{display:block}
  .nav.brseul [data-a="search"]{display:none}
}
.phone .dd-panel{position:absolute}
.menu-panel{position:absolute;left:0;right:0;top:100%;background:#fff;box-shadow:0 12px 24px rgba(0,0,0,.2);padding:.75rem 16px 1rem;border-top:1px solid var(--gris-brd);max-height:80vh;overflow:auto}
.menu-panel a.big{display:flex;align-items:center;gap:.6rem;padding:.65rem .5rem;font-weight:800;text-decoration:none;color:var(--texte);border-bottom:1px solid var(--gris-bg);font-size:1.05rem}
.menu-panel h3{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--texte-doux);margin:.8rem 0 .3rem}
.seg{display:flex;flex-wrap:wrap;gap:.3rem}

/* ═══ Accueil ═══ */
.hero{text-align:center;padding:1.2rem 0 1.4rem}
.hero h1{color:var(--bleu-fort);margin-bottom:.4rem}
.ctx{display:inline-flex;align-items:center;gap:.5rem .9rem;flex-wrap:wrap;justify-content:center;background:#fff;box-shadow:var(--shadow);border-radius:var(--radius);padding:.6rem .9rem;margin-top:1rem}
.ctx .lab{font-weight:800;font-size:.9rem;color:#555}
.puce{border:2px solid var(--gris-brd);background:#fff;border-radius:999px;padding:.25rem .7rem;font-weight:800;font-size:.88rem;transition:all .15s}
.puce:hover{border-color:var(--vert)}
.puce[aria-pressed="true"]{background:var(--vert-texte);border-color:var(--vert-texte);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1.1rem;margin:1.2rem 0}
.tile{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:1.3rem 1rem;text-decoration:none;color:var(--texte);display:flex;flex-direction:column;align-items:center;gap:.5rem;text-align:center;border-top:5px solid var(--bleu);transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.15)}
.tile .ic{font-size:2.5rem;line-height:1}
.tile .tt{font-weight:800;font-size:1.15rem}
.tile .dd2{font-size:.85rem;color:#555}
.tile.monde{border-color:var(--violet)}.tile.maths{border-color:var(--bleu)}.tile.francais{border-color:var(--vert)}.tile.brezhoneg{border-color:var(--orange)}.tile.prog{border-color:var(--violet)}.tile.fiches{border-color:var(--rose)}
.h-sec{font-size:1.15rem;font-weight:800;margin:1.6rem 0 .6rem;display:flex;align-items:center;gap:.5rem}
.reprendre{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.7rem}
.rep{display:flex;gap:.7rem;align-items:center;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:.7rem .9rem;text-decoration:none;color:var(--texte);border-left:5px solid var(--orange)}
.rep:hover{transform:translateY(-2px)}
.rep .ic{font-size:1.7rem}
.rep strong{display:block;font-size:.95rem}.rep small{color:var(--texte-doux);font-size:.8rem}
.kid-title{font-size:2.6rem;text-align:center;color:var(--bleu-fort);font-weight:900;margin:.6rem 0 1rem}
.kid-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1.2rem}
.kid-tile{background:#fff;border-radius:28px;box-shadow:var(--shadow);padding:1.6rem 1rem;text-align:center;text-decoration:none;color:var(--texte);border-bottom:10px solid var(--bleu);display:flex;flex-direction:column;gap:.4rem;align-items:center;font-weight:900;font-size:1.5rem;transition:transform .15s}
.kid-tile:hover{transform:scale(1.04)}
.kid-tile .ic{font-size:4.5rem;line-height:1.1}
.kid-tile.francais{border-color:var(--vert)}.kid-tile.monde{border-color:var(--violet)}.kid-tile.brezhoneg{border-color:var(--orange)}
.kid-tile.small{font-size:1.1rem;padding:1rem .6rem}.kid-tile.small .ic{font-size:3rem}
.optional{font-size:.85rem;color:var(--texte-doux);margin-top:1rem;text-align:center}
.linkbtn{background:none;border:none;color:var(--bleu-fort);text-decoration:underline;padding:0;font-weight:600}

/* ═══ Page de matière ═══ */
.encart{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;background:#fff7e6;border:2px solid #f5c27a;border-radius:var(--radius);padding:.9rem 1.1rem;margin:1rem 0 1.2rem}
.encart .ic{font-size:2rem}
.encart p{flex:1;min-width:220px}
.vsel{margin-left:auto;display:inline-flex;border:2px solid var(--gris-brd);border-radius:20px;overflow:hidden;background:#fff}.vsel button{border:none;background:#fff;padding:.3rem .8rem;font-weight:700;font-size:.85rem}.vsel button[aria-pressed="true"]{background:var(--bleu-fort);color:#fff}
.ctxbar{display:flex;flex-wrap:wrap;gap:.5rem .8rem;align-items:center;margin:.4rem 0 .8rem;font-size:.9rem}
.jump{display:flex;gap:.4rem;flex-wrap:wrap;margin:.8rem 0}
.dom{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);margin:1.1rem 0;overflow:hidden;border-top:5px solid var(--bleu);scroll-margin-top:70px}
.dom>h2{padding:.8rem 1.1rem .2rem}
.reslist{list-style:none}
.res{display:grid;grid-template-columns:1fr auto;gap:.15rem .6rem;padding:.55rem 0;border-bottom:1px solid var(--gris-bg);align-items:center}
.res:last-child{border-bottom:none}
.res a.t{font-weight:700;text-decoration:none;color:var(--texte);display:flex;gap:.45rem;align-items:center}
.res a.t:hover{color:var(--bleu-fort);text-decoration:underline}
.res .badges{display:flex;gap:.25rem;justify-content:flex-end}
.res .pills{grid-column:1/-1}
.empty{color:var(--texte-doux);font-size:.9rem;padding:.4rem 0;font-style:italic}

/* ═══ Fiches toutes prêtes ═══ */
.filters{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:1rem 1.1rem;display:grid;gap:.8rem}
.frow{display:flex;flex-wrap:wrap;gap:.4rem .6rem;align-items:center}
.frow>.lab{font-weight:800;font-size:.8rem;text-transform:uppercase;color:var(--texte-doux);min-width:4.5rem}
.search{flex:1;min-width:200px;border:2px solid var(--gris-brd);border-radius:8px;padding:.5rem .8rem}
.search:focus{border-color:var(--bleu)}
select.sel{border:2px solid var(--gris-brd);border-radius:20px;padding:.3rem .7rem;background:#fff;font-weight:700;font-size:.88rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;margin-top:1rem}
@container vp (max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:.7rem}}
.fcard{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);text-decoration:none;color:var(--texte);display:flex;flex-direction:column;overflow:hidden;transition:transform .15s}
.fcard:hover{transform:translateY(-3px)}
.fcard .mini{background:#eef2f7;padding:.7rem .7rem 0;display:flex;justify-content:center;height:170px;overflow:hidden}
.fcard .mini svg{height:100%;width:auto;box-shadow:0 2px 8px rgba(0,0,0,.2);background:#fff}
.fcard .info{padding:.7rem .8rem .8rem;display:flex;flex-direction:column;gap:.35rem;flex:1}
.fcard strong{font-size:.92rem;line-height:1.25}
.fcard .meta{font-size:.78rem;color:var(--texte-doux);margin-top:auto}

/* cartes de ressources, domaines repliables, listes */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.8rem;margin-top:.4rem}
@container vp (max-width:520px){.rgrid{grid-template-columns:1fr 1fr;gap:.6rem}}
@container vp (max-width:400px){.rgrid{grid-template-columns:1fr}}
.rcard{background:#fff;border:2px solid var(--gris-bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:.9rem .8rem;text-decoration:none;color:var(--texte);display:flex;flex-direction:column;align-items:center;text-align:center;gap:.35rem;border-top:5px solid var(--bleu);transition:transform .15s,box-shadow .15s}
.rcard:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.15)}
.rc-ic{font-size:2.6rem;line-height:1.1}
.rcard strong{font-size:.98rem;line-height:1.25}
.rc-d{font-size:.82rem;color:#555;line-height:1.3}
.rcard .badges{display:flex;gap:.25rem;flex-wrap:wrap;justify-content:center;margin-top:auto}
.rcard .pills{justify-content:center}
details.dom{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);margin:.8rem 0;border-top:5px solid var(--bleu);scroll-margin-top:70px}
details.dom.vide{border-top-color:var(--gris-brd);background:#fcfcfd}
details.dom>summary{display:flex;flex-wrap:wrap;align-items:baseline;gap:.2rem .8rem;padding:.8rem 1.1rem;cursor:pointer;list-style-position:inside}
.dom-t{font-size:1.2rem;font-weight:800}
.dom-n{font-size:.88rem;color:var(--texte-doux);margin-left:auto}
details.dom.vide .dom-t{color:#555}
.dom-body{padding:0 1.1rem 1rem}
.sub h3{margin:.8rem 0 .2rem;color:var(--bleu-fort);font-size:.85rem;text-transform:uppercase;letter-spacing:.04em}
.sub h3.sh{font-size:.95rem;text-transform:none}
.note-hors{background:var(--gris-bg);border-radius:8px;padding:.4rem .7rem;font-size:.86rem;color:#555}
.avenir-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.8rem;margin-top:.6rem}
.avenir{border:2px dashed var(--gris-brd);border-radius:var(--radius);padding:.9rem;text-align:center;display:flex;flex-direction:column;gap:.3rem;align-items:center;background:#fff;color:#555}
.quiz{margin:1rem 0;border-top:5px solid var(--violet)}
.level-btn.ok{background:#e8f6e8;border-color:var(--vert-texte);color:var(--vert-texte)}.level-btn.ko{background:#fdecea;border-color:var(--rouge-texte);color:var(--rouge-texte)}
.hold{background:none;border:none;display:block;margin:.4rem auto;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:50%}
.nbtn.retour{background:#fff8e1;border-color:#f5c27a}.nbtn .lbl3{display:none}
@container vp (max-width:960px){.nbtn.retour .lbl2{display:none}.nbtn.retour .lbl3{display:inline}}
.langs{margin-top:.5rem;font-size:.92rem}.lg{display:inline-flex;gap:.3rem;align-items:center;padding:.1rem .1rem}.lg.cur{font-weight:800;border-bottom:3px solid var(--bleu-fort)}
.actions.two{display:grid;grid-template-columns:1fr 1fr}.actions.two .btn{justify-content:center}
.ltab{width:100%;border-collapse:collapse;font-size:.92rem;margin-top:.4rem}
.ltab th,.ltab td{padding:.45rem .5rem;border-bottom:1px solid var(--gris-bg);text-align:left;vertical-align:middle}
.ltab thead th{font-size:.75rem;text-transform:uppercase;color:#555;border-bottom:2px solid var(--gris-brd)}
.sortb{background:none;border:none;font:inherit;font-weight:800;text-transform:uppercase;color:inherit;padding:0}
.ltab a{color:var(--texte);text-decoration:none}.ltab a:hover strong{text-decoration:underline}
.ltab td.c-act{white-space:nowrap;display:table-cell}.ltab td.c-act .btn{margin-left:.25rem}
.ltab .btn-sm{padding:.2rem .6rem;font-size:.8rem}
@container vp (max-width:760px){table.prog td:first-child,table.prog th:first-child{position:sticky;left:0;background:#fff;z-index:1;min-width:7.5rem;max-width:7.5rem;font-size:.78rem;box-shadow:2px 0 4px rgba(0,0,0,.08)}table.prog th:first-child{background:var(--gris-bg)}}
a.refl{display:block;margin:.1rem auto 0;font-size:.68rem;font-weight:700;line-height:1.15;color:var(--bleu-fort);text-decoration:underline;max-width:5.2rem}
.off a.refl{display:inline;max-width:none;font-size:.78rem}
a.dot{color:var(--texte);text-decoration:none;font-size:1.3rem;display:inline-block;padding:.1rem .5rem;border-radius:8px}a.dot:hover{background:#e8f1fc;color:var(--bleu-fort)}
@container vp (max-width:760px){
  .ltab thead{display:none}.ltab,.ltab tbody{display:block}
  .ltab tr{display:grid;grid-template-columns:1fr auto;gap:.15rem .5rem;padding:.5rem 0;border-bottom:1px solid var(--gris-bg)}
  .ltab td{border:none;padding:0}.ltab td.c-type{display:none}.ltab td.c-cl{grid-column:1/2}.ltab td.c-b{grid-column:2/3;grid-row:1/2;justify-self:end}
  .ltab td.c-act{grid-column:1/-1;white-space:normal}.ltab td.c-act .btn{margin:.2rem .25rem 0 0}
}
/* ═══ Feuille ═══ */
.sheet{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:1.6rem;align-items:start}
@container vp (max-width:820px){.sheet{grid-template-columns:1fr}}
.preview{background:#e3e8ee;border-radius:var(--radius);padding:1rem;display:flex;flex-direction:column;align-items:center;gap:.7rem}
.preview .pg{width:100%;display:flex;justify-content:center}
.preview .pg svg{max-width:100%;max-height:480px;width:auto;height:auto;box-shadow:0 4px 16px rgba(0,0,0,.25);background:#fff}
.pager{display:flex;align-items:center;gap:.8rem;font-weight:700}

      const hh = Math.floor(hash(i + p * 7) * 12), mm = [0, 15, 30, 45][Math.floor(hash(i + 3) * 4)];

  } else if (kind === 'motifs') {
    for (let r = 0; r < 7; r++) for (let i = 0; i < 8; i++) { const x = 18 + i * ((W - 36) / 8), y = 40 + r * 32, k = i % (2 + r % 3), col = ['#4a90e2','#e74c3c','#5cb85c'][k % 3];
      b += i === 7 ? `<rect x="${x-6}" y="${y-6}" width="12" height="12" rx="2" fill="none" stroke="#999" stroke-dasharray="2 1.5"/><text x="${x}" y="${y+3}" text-anchor="middle" font-size="9" fill="#999" font-family="Segoe UI">?</text>` : (k % 2 ? `<circle cx="${x}" cy="${y}" r="6" fill="${col}"/>` : `<rect x="${x-6}" y="${y-6}" width="12" height="12" fill="${col}"/>`); }
  } else if (kind === 'monnaie') {
    const coins = ['1 €','2 €','50 c','20 c','10 c','5 c','1 c','2 €'];
    coins.forEach((c, i) => { const x = 35 + (i % 4) * ((W - 50) / 4), y = 55 + Math.floor(i / 4) * 45, r = 13 - (c.endsWith('c') ? 2 : 0);
      b += `<circle cx="${x}" cy="${y}" r="${r}" fill="${c.endsWith('c') ? '#c97b4a' : '#e6c14a'}" stroke="#8a6d00"/><text x="${x}" y="${y+3}" font-size="7" text-anchor="middle" font-weight="700" fill="#4a3600" font-family="Segoe UI">${c}</text>`; });
    for (let i = 0; i < 6; i++) b += `<rect x="12" y="${160+i*17}" width="${W-24}" height="11" rx="2" fill="#f1f3f5"/><text x="16" y="${168+i*17}" font-size="5.5" fill="#555" font-family="Segoe UI">J’ai ….. pièces de 2 € et ….. pièces de 50 c : cela fait …………</text>`;
  } else { // texte
    for (let i = 0; i < 14; i++) b += `<rect x="12" y="${34+i*16}" width="${(W-24)*(i % 5 === 4 ? .55 : .96)}" height="5" rx="2.5" fill="#dfe5ec"/>${i % 2 ? '' : `<line x1="12" x2="${W-12}" y1="${44+i*16}" y2="${44+i*16}" stroke="#f0a0a0" stroke-width=".4"/>`}`;
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Aperçu, page ${p+1}"><rect width="${W}" height="${H}" fill="#fff"/>${bar}${b}${foot}</svg>`;
}
const mini = f => pageSVG(f.kind, f.titre, 0, false);

const route = () => { const h = location.hash.replace(/^#\/?/, ''); const [path, q] = h.split('?'); return { path: path || '', params: new URLSearchParams(q || '') }; };

/* génération pseudo-aléatoire pour le formulaire */
function rng(seed) { let a = seed * 2654435761 >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function persoSVG() {
  const land = P.or === 'paysage', W = land ? 297 : 210, H = land ? 210 : 297, r = rng(P.seed + P.tables.join('') .length * 7 + P.n);
  const tb = P.tables.length ? P.tables : [2];
  const qs = Array.from({ length: P.n }, () => { const a = tb[Math.floor(r() * tb.length)], b = 1 + Math.floor(r() * 10), t = P.type === 'mix' ? (r() < .5 ? 'calc' : 'trous') : P.type; return { a, b, t: t }; });
  const cols = land ? 3 : 2, per = Math.ceil(P.n / cols), rowH = Math.min(18, (H - 70) / Math.max(per, 1));
  let b = P.nom ? `<text x="10" y="32" font-size="6" fill="#555" font-family="Segoe UI">Prénom : ............................   Date : ........................</text>` : '';
  qs.forEach((q, i) => { const x = 14 + Math.floor(i / per) * ((W - 20) / cols), y = 48 + (i % per) * rowH, p = q.a * q.b;
    const ans = P.corrige ? `<tspan fill="#2e7d32" font-weight="700">${q.t === 'calc' ? p : q.b}</tspan>` : '……';
    b += `<text x="${x}" y="${y}" font-size="8" font-family="Segoe UI" fill="#2c3e50"><tspan font-weight="700" fill="#2f70c0">${i+1}.</tspan>  ${q.t === 'calc' ? `${q.a} × ${q.b} = ${ans}` : `${q.a} × ${ans} = ${p}`}</text>`; });
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Aperçu de la fiche personnalisée"><rect width="${W}" height="${H}" fill="#fff"/><rect width="${W}" height="20" fill="#4a90e2"/><text x="10" y="13.5" font-size="8" font-weight="700" fill="#fff" font-family="Segoe UI">Tables de multiplication${P.corrige ? ' — corrigé' : ''}</text>${b}</svg>`;
}
