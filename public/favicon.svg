<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- École Primaire / Skoolik : une feuille de cahier Seyès et un crayon -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5aa0ee"/>
      <stop offset="1" stop-color="#3a78c9"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#fond)"/>
  <!-- feuille -->
  <rect x="13" y="10" width="34" height="44" rx="3" fill="#fff"/>
  <!-- lignes du cahier et marge rouge -->
  <g stroke="#9aa6e6" stroke-width="1.6" stroke-linecap="round">
    <line x1="17" y1="22" x2="43" y2="22"/>
    <line x1="17" y1="30" x2="43" y2="30"/>
    <line x1="17" y1="38" x2="43" y2="38"/>
    <line x1="17" y1="46" x2="43" y2="46"/>
  </g>
  <line x1="21" y1="12" x2="21" y2="52" stroke="#e5484d" stroke-width="1.6"/>
  <!-- crayon en diagonale -->
  <g transform="rotate(45 44 36)">
    <rect x="38.5" y="14" width="11" height="34" rx="2" fill="#f5b823"/>
    <rect x="38.5" y="14" width="11" height="5" rx="1.5" fill="#f08c9a"/>
    <rect x="38.5" y="19" width="11" height="2.5" fill="#c9ced6"/>
    <path d="M38.5 48 L44 58 L49.5 48 Z" fill="#f7dcae"/>
    <path d="M42.2 54.7 L44 58 L45.8 54.7 Z" fill="#2c3e50"/>
  </g>
</svg>
